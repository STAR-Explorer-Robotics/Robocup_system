[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rescue-inspection"
version = "0.1.0"
description = "Inspection baselines for RoboCup Rescue Robot League."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.9.0.80",
  "pupil-apriltags>=1.0.4",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
realsense = ["pyrealsense2"]
runtime = [
  "onnxruntime>=1.18.0,<2.0",
]
runtime-gpu = [
  "onnxruntime-gpu>=1.18.0,<2.0",
]
train = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "onnx>=1.16.0",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.18.0",
  "tqdm>=4.66.0",
  "pillow>=10.0.0",
  "scikit-learn>=1.4.0",
  "matplotlib>=3.8.0",
  "qrcode[pil]>=7.4.2",
  "ultralytics>=8.3.0",
]

[project.scripts]
inspection-run = "rescue_inspection.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

